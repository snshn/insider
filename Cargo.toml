[package]
name = "insider"
version = "0.1.1"
edition = "2021"
license = "0BSD"
description = "Realtime TUI hardware inspector that draws your mainboard and everything plugged into it"
homepage = "https://github.com/snshn/insider"
repository = "https://github.com/snshn/insider"
readme = "README.md"
rust-version = "1.74"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
