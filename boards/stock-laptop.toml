# Generic laptop — a stand-in until a real board layout exists.
#
# Coordinates are in terminal cells at 1:1 scale (a cell is roughly twice as
# tall as it is wide, so draw things about 2x wider than they'd be on a photo).
# anatomy scales the whole drawing to fit the terminal.
#
# Left: the lid (camera, mic, screen) and the base (keyboard, speakers,
# touchpad, battery). Right: the mainboard, its fans above it.
# Everything on the left is cabled to a connector on the board (`link`).

name = "Generic laptop mainboard"
form = "laptop"
generic = true
width = 160
height = 50
color = "#123524"
pcb = { x = 68, y = 10, w = 92, h = 26 }

# A real layout would add one or more [[match]] tables, e.g.
# [[match]]
# sys_vendor = "Razer"
# product_name = "Blade 15"

# ---------------------------------------------------------------- lid

[[slot]]
id = "camera"
kind = "camera"
x = 27
y = 0
w = 10
h = 2
link = "camc"
label = "Camera"

[[slot]]
