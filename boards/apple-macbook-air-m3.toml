# Apple MacBook Air (M3, 2024), 13-inch (Mac15,12) and 15-inch (Mac15,13).
#
# Traced from a photo of the bare board (top side), left to right: USB-C /
# MagSafe flex connectors on the left edge, the power stage (inductors), the
# M3 package with its unified memory, the two NAND packages on the right.
# A tab below the SoC carries the keyboard/trackpad and battery connectors.
# Everything is soldered; the Air is fanless, so there are no fans at all.
#
# Scale: 1 px of an 800 px-wide photo ≈ 0.2 cells across, 0.1 cells down.
# Connector identities are a best guess; positions follow the photo.

name = "Apple MacBook Air (M3)"
form = "laptop"
width = 206
height = 50
color = "#17191c"
pcb = { x = 68, y = 2, w = 136, h = 17 }
pcb_extra = [
  { x = 134, y = 19, w = 20, h = 2 },   # step under the Wi-Fi package
  { x = 154, y = 19, w = 42, h = 5 },   # tab with the KB/TP and battery connectors
]

[[match]]
sys_vendor = "Apple"
board_name = "Mac15,12"   # 13-inch

[[match]]
sys_vendor = "Apple"
board_name = "Mac15,13"   # 15-inch

# ---------------------------------------------------------------- lid

[[slot]]
id = "camera"
kind = "camera"
x = 27
y = 0
w = 10
h = 2
link = "camc"
label = "Camera"

[[slot]]
id = "mic"
kind = "microphone"
x = 39
y = 0
w = 4
h = 2
link = "camc"
label = "Mic"

[[slot]]
id = "screen"
kind = "display"
x = 0
y = 3
w = 64
h = 21
soldered = true
bind = ["internal"]
link = "edp"
label = "Liquid Retina"

# ---------------------------------------------------------------- base

[[slot]]
id = "keyboard"
kind = "keyboard"
x = 3
y = 27
w = 58
h = 10
soldered = true
link = "kbtp"
label = "Keyboard"

# under the board, as in the chassis: speakers either side of the battery,
# the trackpad in front of it
[[slot]]
id = "spk_l"
kind = "speaker"
x = 68
y = 27
w = 16
h = 12
link = "spkc"
label = "Speaker L"

[[slot]]
id = "bat0"
kind = "battery"
x = 88
y = 27
w = 96
h = 12
link = "batc"
label = "Battery"

[[slot]]
id = "spk_r"
kind = "speaker"
x = 188
y = 27
w = 16
h = 12
link = "spkc"
label = "Speaker R"

[[slot]]
id = "touchpad"
kind = "touchpad"
x = 106
y = 41
w = 60
h = 8
soldered = true
link = "kbtp"
label = "Trackpad"

# ---------------------------------------------------------------- logic board (PCB origin x = 68, y = 2)

# left edge: the port flexes
[[slot]]
id = "usb0"
kind = "usb"
x = 68
y = 6
w = 3
h = 2
label = "USB-C"

[[slot]]
id = "usb1"
kind = "usb"
x = 68
y = 10
w = 3
h = 2
label = "USB-C"

[[slot]]
id = "magsafe"
kind = "connector"
x = 69
y = 14
w = 6
h = 2
soldered = true
label = "MAG"

[[slot]]
id = "bios"
kind = "bios"
x = 76
y = 5
w = 14
h = 3
soldered = true
label = "iBoot"

# power stage; also holds anything no other slot takes
[[slot]]
id = "chips"
kind = "pci"
x = 100
y = 5
w = 28
h = 8
soldered = true
catchall = true
label = ""

# top edge: display and camera flexes
[[slot]]
id = "edp"
kind = "connector"
x = 136
y = 2
w = 6
h = 2
soldered = true
label = "eDP"

[[slot]]
id = "camc"
kind = "connector"
x = 142
y = 2
w = 6
h = 2
soldered = true
label = "CAM"

[[slot]]
id = "wifi"
kind = "wifi"
x = 135
y = 15
w = 13
h = 5
soldered = true
label = "Wi-Fi"

# the M3 package. CPU and GPU are on the same die, so the GPU slot sits
# inside the CPU slot, which makes the CPU slot the package around both.
# The unified memory is next to it.
[[slot]]
id = "cpu0"
kind = "cpu"
x = 149
y = 3
w = 24
h = 15
soldered = true
label = "CPU"

[[slot]]
id = "gpu0"
kind = "gpu"
x = 150
y = 13
w = 22
h = 4
soldered = true
label = "GPU"

[[slot]]
id = "ram"
kind = "dimm"
x = 174
y = 5
w = 14
h = 9
soldered = true
bind = ["unified"]
label = "LPDDR5"

[[slot]]
id = "nand"
kind = "ssd"
x = 190
y = 5
w = 12
h = 10
soldered = true
label = "NAND"

[[slot]]
id = "spkc"
kind = "connector"
x = 196
y = 16
w = 6
h = 2
soldered = true
label = "SPK"

# the tab
[[slot]]
id = "kbtp"
kind = "connector"
x = 162
y = 21
w = 10
h = 2
soldered = true
label = "KB/TP"

[[slot]]
id = "batc"
kind = "connector"
x = 178
y = 21
w = 6
h = 2
soldered = true
label = "BAT"
