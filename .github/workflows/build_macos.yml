name: macOS

on:
  push:
    branches: [ master ]
    paths-ignore:
    - 'assets/**'
    - 'dist/**'
    - 'docs/**'
    - 'LICENSE'
    - 'README.md'

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
        rust:
          - stable
    runs-on: ${{ matrix.os }}

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - name: Build
      run: cargo build --all --locked --verbose
